# UI5 tooling: serves the app and proxies OData to the locally running backend
specVersion: "3.0"
metadata:
  name: uim.gdpr
type: application
resources:
  configuration:
    paths:
      webapp: .
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: "http://localhost:8080/odata"
